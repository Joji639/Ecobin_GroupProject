server {
    listen 80;
    server_name ecobinproduction.duckdns.org;

    # Certbot HTTP-01 renewal challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ecobinproduction.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/ecobinproduction.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecobinproduction.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}