openapi: 3.0.3
info:
  title: EcoBin API
  version: 1.0.0
  description: API documentation for EcoBin backend
paths:
  /accounts/2fadisable/:
    post:
      operationId: accounts_2fadisable_create
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/2falogin/:
    post:
      operationId: accounts_2falogin_create
      description: 'Step 2 of login: identifier + TOTP code, issues real JWT tokens.'
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /accounts/2fasetup/:
    post:
      operationId: accounts_2fasetup_create
      description: 'Step 1: Generate a TOTP secret and return a QR code to scan.'
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/2faverify/:
    post:
      operationId: accounts_2faverify_create
      description: 'Step 2: Confirm the user scanned correctly by submitting a valid
        code, activating 2FA.'
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/accountinfo/:
    get:
      operationId: accounts_accountinfo_retrieve
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: accounts_accountinfo_partial_update
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/admin/login/:
    post:
      operationId: accounts_admin_login_create
      description: Login for the super admin via email + password (with 2FA branch).
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /accounts/admin/onboardings/:
    get:
      operationId: accounts_admin_onboardings_retrieve
      description: 'Super admin: list all onboarding requests (operators + operator
        admins).'
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/admin/operatoradmins/:
    get:
      operationId: accounts_admin_operatoradmins_retrieve
      description: 'Super admin: list all operator admins.'
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/admin/operators/:
    get:
      operationId: accounts_admin_operators_retrieve
      description: 'Super admin: list all operators.'
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/admin/useronboardings/:
    get:
      operationId: accounts_admin_useronboardings_retrieve
      description: 'Operator admin / super admin: list user (customer) onboarding
        requests.'
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/admin/useronboardings/approve/:
    post:
      operationId: accounts_admin_useronboardings_approve_create
      description: Operator admin / super admin approves a user's onboarding.
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/admin/useronboardings/reject/:
    post:
      operationId: accounts_admin_useronboardings_reject_create
      description: Operator admin / super admin rejects a user's onboarding.
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/admin/users/:
    get:
      operationId: accounts_admin_users_retrieve
      description: 'Super admin: list all regular users.'
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/changepassword/:
    post:
      operationId: accounts_changepassword_create
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/forgotpassword/:
    post:
      operationId: accounts_forgotpassword_create
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /accounts/googleauth/:
    post:
      operationId: accounts_googleauth_create
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /accounts/login/:
    post:
      operationId: accounts_login_create
      description: Login for operator and operator admin via email/phone OR operator_id
        (OP-/OA-) + password.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /accounts/loginuser/:
    post:
      operationId: accounts_loginuser_create
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /accounts/logout/:
    post:
      operationId: accounts_logout_create
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/onboardinguser/:
    post:
      operationId: accounts_onboardinguser_create
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/operator/account-info/:
    get:
      operationId: accounts_operator_account_info_retrieve
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: accounts_operator_account_info_partial_update
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/operator/admin/onboardings/:
    get:
      operationId: accounts_operator_admin_onboardings_retrieve
      description: 'Operator admin: list operator onboarding requests. Super admin:
        see all.'
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/operator/admin/onboardings/approve/:
    post:
      operationId: accounts_operator_admin_onboardings_approve_create
      description: Operator admin approves operators; super admin approves operator
        admins.
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/operator/admin/onboardings/reject/:
    post:
      operationId: accounts_operator_admin_onboardings_reject_create
      description: Operator admin rejects operators; super admin rejects operator
        admins.
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/operator/change-password/:
    post:
      operationId: accounts_operator_change_password_create
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/operator/logout/:
    post:
      operationId: accounts_operator_logout_create
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/operator/onboarding/:
    get:
      operationId: accounts_operator_onboarding_retrieve
      description: Submit, view, or update the staff member's own onboarding request
        (operator or operator admin).
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: accounts_operator_onboarding_create
      description: Submit, view, or update the staff member's own onboarding request
        (operator or operator admin).
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: accounts_operator_onboarding_partial_update
      description: Submit, view, or update the staff member's own onboarding request
        (operator or operator admin).
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/operator/personal-info/:
    get:
      operationId: accounts_operator_personal_info_retrieve
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: accounts_operator_personal_info_partial_update
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/personalinfo/:
    get:
      operationId: accounts_personalinfo_retrieve
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: accounts_personalinfo_partial_update
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /accounts/register/:
    post:
      operationId: accounts_register_create
      description: Register an operator (role='operator') or operator admin (role='operatoradmin').
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /accounts/registeruser/:
    post:
      operationId: accounts_registeruser_create
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /accounts/resetpassword/:
    post:
      operationId: accounts_resetpassword_create
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
